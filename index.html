<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Closer by Day</title><style>
:root{--bg:#FBF6EF;--text:#1E2A52;--muted:#5B6280;--accent:#C9663A;--card:#FFFFFF;--line:#EADFD2}
@media (prefers-color-scheme:dark){:root{--bg:#141A33;--text:#F5EFE6;--muted:#B8BCD0;--accent:#FFB86B;--card:#1E2647;--line:#2E3760}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:32px 16px 64px}a{color:var(--accent)}

.table{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:15px;background:var(--card)}

footer{margin-top:48px;color:var(--muted);font-size:14px}
.hero{padding:48px 0 16px}.hero p{color:var(--muted);font-size:19px}
</style></head>
<body><main>
<nav><a href="/">Closer by Day</a><a href="/privacy">Privacy</a><a href="/terms">Terms</a><a href="/support">Support</a></nav>

<p>Turn a goal into small daily or weekly steps. Your picture gets clearer with every step.</p></div>
